# ===== MySQL 环境配置 =====
# 使用方式: 启动时加 --spring.profiles.active=mysql
# 例如: java -jar xxx.jar --spring.profiles.active=mysql
# 或 IDE 中配置 VM options: -Dspring.profiles.active=mysql
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/overseas_learning?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 你的密码

pagehelper:
  helper-dialect: mysql