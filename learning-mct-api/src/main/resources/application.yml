# ============================================
# 学习项目主配置（本地配置）
#
# 【配置中心后的分工】（★ 对齐 qingo）
#   bootstrap.yml   → 只配「怎么连 Nacos 配置中心」（先加载）
#   Nacos 配置中心   → 放「会变、多环境不同」的配置（如超时时间、开关、限流值）
#   application.yml → 放「基本不变」的配置（端口、数据源、中间件地址）
#
#   读取优先级：Nacos 远程配置 > 本地 application.yml
#   也就是说：同一个 key，Nacos 里配了，就用 Nacos 的，覆盖本地。
# ============================================
server:
  port: 9090

spring:
  application:
    name: overseas-learning   # ★ 服务名：服务A 注册到 Nacos 的名字（bootstrap.yml 也用了）

  # ===== MongoDB 配置（本机 C:\mongodb，27017）=====
  data:
    mongodb:
      uri: mongodb://localhost:27017/learning_db   # learning_db 是数据库名，不用提前建，插入时自动创建

  # ===== 数据源 (MySQL) =====
  datasource:
    url: jdbc:mysql://localhost:3306/oversea_learning?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  # ===== 自动执行 SQL 初始化脚本 =====
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-mysql.sql
      data-locations: classpath:db/data.sql

  # ===== Redis 配置（本机 C:\redis，127.0.0.1:6379，无密码）=====
  redis:
    host: 127.0.0.1
    port: 6379
    # password:            # 本机学习用，无密码
    database: 0            # Redis 默认 16 个库(0~15)，用 0 号库
    timeout: 5000          # 连接超时（毫秒）
    lettuce:
      pool:
        max-active: 10     # 连接池最大连接数
        max-idle: 5
        min-idle: 1

  # ===== Kafka 配置（本机 C:\kafka，localhost:9092）=====
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # 消息 key/value 都用字符串序列化（qingo 传 JSON 字符串）
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: overseas-learning-group   # 消费者组：同组内消息只被消费一次
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest          # 第一次启动时从头开始消费
      enable-auto-commit: false            # 手动提交 offset（和 qingo 的 ack.acknowledge() 对应）
    listener:
      ack-mode: manual                     # 手动确认，配合上面的 Acknowledgment

  # ===== RocketMQ 配置（对齐 qingo，默认关闭：本机没装 RocketMQ 也能正常启动）=====
  # qingo 用它的场景很聚焦：分账可靠投递(topic-order-divide-complete-mp)、延迟关单(topic-order-delay-cancel-mp)
  # 想用真服务演示时：本机起 NameServer(9876)+Broker，把下面 enabled 改 true 即可
  rocketmq:
    enabled: false                          # ★ 开关：false=不装配生产者/消费者，纯看代码不连服务
    name-server: localhost:9876             # RocketMQ 的「注册中心」，类比 Kafka 的 bootstrap-servers
    producer:
      group: overseas-learning-producer     # 生产者组
      send-message-timeout: 3000

  # ===== Elasticsearch 配置（本机 localhost:9200，HTTP 接口）=====
  # qingo 的配置在 Nacos 上，写法一样：spring.elasticsearch.uris
  # 本地学习用，连不上 ES 不影响其他功能，只是 ES 相关接口报错
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 10s
  # 关闭 ES 健康检查，避免 ES 没启动时项目启动失败
  management:
    health:
      elasticsearch:
        enabled: false

# ===== MyBatis 配置 =====
mybatis:
  # classpath*（带星号）：扫描所有 jar 里的 mapper 目录。
  # MerchantMapper.xml 已抽到 learning-orm-common 模块的 jar 内，
  # 写成 classpath:（不带星）只能扫本模块 resources，会漏掉公共模块的 XML
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.overseas.learning.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ===== 分页插件 =====
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# ===== 日志级别 =====
logging:
  level:
    com.overseas.learning: DEBUG
  pattern:
    # 控制台日志格式：在级别后面加 [%X{reqId}]，输出 MDC 里的 reqId（WebLogAspect 塞的）。
    # 这样一次请求经过的 Controller/Biz/数据层日志都带同一个 reqId，方便按 ID 串起完整链路。
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{reqId}] ${PID:- } --- [%15.15t] %-40.40logger{39} : %m%n"

# ===== xxl-job 执行器配置 =====
# 执行器 = 你的项目（负责真正干活）；调度中心 = xxl-job-admin（负责到点下发命令）
xxl:
  job:
    admin:
      addresses: http://localhost:9091/xxl-job-admin   # 调度中心地址
    accessToken: default_token                          # 和调度中心 application.properties 里一致
    executor:
      appname: overseas-learning-executor               # 执行器名称（调度中心里要对应）
      address: ''                                       # 留空=自动获取本机地址
      ip: ''
      port: 9999                                        # 执行器端口（调度中心通过它回调你的项目）
      logpath: logs/xxl-job                             # 任务日志存放目录
      logretentiondays: 7