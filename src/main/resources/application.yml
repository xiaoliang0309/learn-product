# ============================================
# 学习项目主配置
# 使用 MySQL 数据库（已安装 8.0.28）
# ============================================
server:
  port: 9090

spring:
  # ===== 数据源 (MySQL) =====
  datasource:
    url: jdbc:mysql://localhost:3306/oversea_learning?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  # ===== 自动执行 SQL 初始化脚本 =====
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-mysql.sql
      data-locations: classpath:db/data.sql

  # ===== Redis 配置（本机 C:\redis，127.0.0.1:6379，无密码）=====
  redis:
    host: 127.0.0.1
    port: 6379
    # password:            # 本机学习用，无密码
    database: 0            # Redis 默认 16 个库(0~15)，用 0 号库
    timeout: 5000          # 连接超时（毫秒）
    lettuce:
      pool:
        max-active: 10     # 连接池最大连接数
        max-idle: 5
        min-idle: 1

  # ===== Kafka 配置（本机 C:\kafka，localhost:9092）=====
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # 消息 key/value 都用字符串序列化（qingo 传 JSON 字符串）
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: overseas-learning-group   # 消费者组：同组内消息只被消费一次
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest          # 第一次启动时从头开始消费
      enable-auto-commit: false            # 手动提交 offset（和 qingo 的 ack.acknowledge() 对应）
    listener:
      ack-mode: manual                     # 手动确认，配合上面的 Acknowledgment

# ===== MyBatis 配置 =====
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.overseas.learning.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ===== 分页插件 =====
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# ===== 日志级别 =====
logging:
  level:
    com.overseas.learning: DEBUG

# ===== xxl-job 执行器配置 =====
# 执行器 = 你的项目（负责真正干活）；调度中心 = xxl-job-admin（负责到点下发命令）
xxl:
  job:
    admin:
      addresses: http://localhost:9091/xxl-job-admin   # 调度中心地址
    accessToken: default_token                          # 和调度中心 application.properties 里一致
    executor:
      appname: overseas-learning-executor               # 执行器名称（调度中心里要对应）
      address: ''                                       # 留空=自动获取本机地址
      ip: ''
      port: 9999                                        # 执行器端口（调度中心通过它回调你的项目）
      logpath: logs/xxl-job                             # 任务日志存放目录
      logretentiondays: 7