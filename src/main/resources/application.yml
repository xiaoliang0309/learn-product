# ============================================
# 学习项目主配置
# 使用 MySQL 数据库（已安装 8.0.28）
# ============================================
server:
  port: 8080

spring:
  # ===== 数据源 (MySQL) =====
  datasource:
    url: jdbc:mysql://localhost:3306/oversea_learning?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  # ===== 自动执行 SQL 初始化脚本 =====
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-mysql.sql
      data-locations: classpath:db/data.sql

# ===== MyBatis 配置 =====
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.overseas.learning.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ===== 分页插件 =====
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# ===== 日志级别 =====
logging:
  level:
    com.overseas.learning: DEBUG