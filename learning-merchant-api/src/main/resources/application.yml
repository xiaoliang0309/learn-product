# ============================================
# 服务B（被调方）配置
# ============================================
server:
  port: 9095   # 服务B 端口（9090=服务A，9092/9093=Kafka，避开冲突用 9095）

spring:
  application:
    name: merchant-service-b   # ★ 服务名：注册到 Nacos 的名字，Feign 按它调用

  # ===== Nacos 注册中心 =====
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848   # Nacos 地址

  # ===== 数据源 (MySQL) =====
  datasource:
    url: jdbc:mysql://localhost:3306/oversea_learning?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  # ===== SQL 初始化脚本（服务B 关闭，表已存在，不用每次初始化）=====
  sql:
    init:
      mode: never

# ===== MyBatis 配置 =====
mybatis:
  # classpath*（带星号）：扫描所有 jar 里的 mapper 目录（含 learning-orm-common 公共模块）
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.overseas.learning.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ===== 分页插件 =====
pagehelper:
  helper-dialect: mysql
  reasonable: true

# ===== 日志级别 =====
logging:
  level:
    com.overseas.learning: DEBUG
